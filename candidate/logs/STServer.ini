[general]

; How much detail the server log shows: trace, debug, info, warn or error
sLogLevel=info

; Enable the console
bConsole=true


[LiveServices]

; Whether to list the server on the public server list
bAnnounceServer=false


[Gameplay]

; (Experimental) Syncs miscellaneous quests when possible
bEnableMiscQuestSync=false

; How much of their gold players lose on death, from 0 to 1 (e.g. 0.05 loses 5%, 0 loses nothing)
fGoldLossFactor=0

; (Experimental) Syncs dropped items by players
bEnableItemDrops=false

; Syncs combat XP within the party
bEnableXpSync=true

; Join parties automatically, as long as there is only one party in the server
bAutoPartyJoin=true

; Syncs up all player calendars to be the same day, month, and year. This uses the date of the player with the furthest ahead date at connection.
bSyncPlayerCalendar=false

; How many seconds pass ingame for every real second (0 to 1000). Changing this can make the game unstable
uTimeScale=20

; Enables the custom multiplayer death system. Only disable it if you use another mod that replaces death
bEnableDeathSystem=true

; Sync chests and displays in player homes and other NoResetZones
bSyncPlayerHomes=false

; Enables pvp
bEnablePvp=false

; Enables NPC greetings (disabled by default since they can be spammy with dialogue sync)
bEnableGreetings=false

; Difficulty for all players: 0 Novice, 1 Apprentice, 2 Adept, 3 Expert, 4 Master, 5 Legendary
uDifficulty=4


[ModPolicy]

; Allow players using Mod Organizer 2 to join. Applies even when bEnableModCheck is off
bAllowMO2=true

; Allow players using SKSE to join. Applies even when bEnableModCheck is off
bAllowSKSE=true

; Refuse clients whose mods do not match Data/loadorder.txt
bEnableModCheck=false


[GameServer]

; Password players need to join the server. Leave empty to let anyone join
sPassword=

; Password for server admins. Joining with it gives admin rights. Leave empty to disable
sAdminPassword=

; Name that shows up in the server list
sServerName=Dedicated Together Server

; Target server tick rate: 70 if true, 60 if false; restart after changing
bPremiumMode=true

; Maximum number of players allowed on the server (going over the default of 8 is not recommended)
uMaxPlayerCount=8

; Which port to host the server on
uPort=10578
