name: Compile vanilla and Bruma inn rental sharing
on:
  push:
    branches: [codex/inn-rental-sync-v184]
    paths:
      - 'mods/inn-rental/**'
      - 'tools/inn-interfaces/**'
      - 'tools/check-inn-rental.py'
      - '.github/workflows/inn-rental.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Papyrus compiler and native interfaces
        run: |
          Invoke-WebRequest 'https://github.com/Orvid/Caprica/releases/download/v0.3.0/Caprica.v0.3.0.7z' -OutFile Caprica.7z
          if ((Get-FileHash Caprica.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0037e54cf3a1021e976278d9a637e8ae541aaf9ebeb8d274b6c2cfe32f4ee559') { throw 'Compiler hash mismatch' }
          7z x Caprica.7z -ocaprica -y
          if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed' }
          git clone https://github.com/ianpatt/skse64.git papyrus-api
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve native interfaces' }
          git -C papyrus-api checkout 25b72352adb6543fa6d0bd3795780672b2e238e0
          if ($LASTEXITCODE -ne 0) { throw 'Wrong native interface revision' }
          New-Item -ItemType Directory -Force papyrus-imports, compiled-pex, logs | Out-Null
          Copy-Item papyrus-api/scripts/vanilla/* papyrus-imports/
          Copy-Item tools/papyrus-interfaces/* papyrus-imports/
          Copy-Item tools/inn-interfaces/* papyrus-imports/ -Force
      - name: Compile and validate the rental script
        run: |
          $compiler = (Get-ChildItem caprica -Recurse -Filter Caprica.exe | Select-Object -First 1).FullName
          $imports = "$env:GITHUB_WORKSPACE/mods/inn-rental/Scripts/Source;$env:GITHUB_WORKSPACE/papyrus-imports"
          & $compiler --game=skyrim --dump-asm --import=$imports --flags="$env:GITHUB_WORKSPACE/papyrus-imports/TESV_Papyrus_Flags.flg" --output="$env:GITHUB_WORKSPACE/compiled-pex" "$env:GITHUB_WORKSPACE/mods/inn-rental/Scripts/Source" 2>&1 | Tee-Object logs/papyrus-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Papyrus compilation failed' }
          python tools/check-inn-rental.py mods/inn-rental compiled-pex | Tee-Object logs/checks.json
          if ($LASTEXITCODE -ne 0) { throw 'Rental overlay validation failed' }
      - name: Retain the combined test package on the requested branch
        run: |
          Copy-Item compiled-pex/*.pex mods/inn-rental/Scripts/
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path mods/inn-rental/* -DestinationPath packages/STR-Inn-Rental-Shared-Vanilla-Bruma-v0.1-test.zip -Force
          Copy-Item logs/checks.json fixes/inn-rental-build-checks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- packages/STR-Inn-Rental-Shared-Vanilla-Bruma-v0.1-test.zip mods/inn-rental/Scripts/*.pex fixes/inn-rental-build-checks.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Retain compiled vanilla and Bruma rental test package [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot retain compiled files' }
            git push origin HEAD:codex/inn-rental-sync-v184
            if ($LASTEXITCODE -ne 0) { throw 'Branch changed during packaging; refusing overwrite' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STR-Inn-Rental-Sharing
          path: |
            packages/STR-Inn-Rental-Shared-Vanilla-Bruma-v0.1-test.zip
            compiled-pex/
            logs/
