name: Build Frostbite Chinese cold-speed and bug fixes

on:
  push:
    branches: [codex/frostbite-chs-cold15]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frostbite-chs-cold15
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Generate and review the localized plugin
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          python tools/frostbite_build.py generate | Tee-Object logs/plugin-generate.json
          if ($LASTEXITCODE -ne 0) { throw 'Plugin generation failed' }
          python tools/frostbite_build.py check | Tee-Object logs/source-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Source and plugin review failed' }
      - name: Prepare pinned compiler and official import declarations
        run: |
          Invoke-WebRequest 'https://github.com/Orvid/Caprica/releases/download/v0.3.0/Caprica.v0.3.0.7z' -OutFile Caprica.7z
          if ((Get-FileHash Caprica.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0037e54cf3a1021e976278d9a637e8ae541aaf9ebeb8d274b6c2cfe32f4ee559') { throw 'Compiler hash mismatch' }
          7z x Caprica.7z -ocaprica -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed' }
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/ianpatt/skse64.git papyrus-api
          if ($LASTEXITCODE -ne 0) { throw 'SKSE API unavailable' }
          git -C papyrus-api fetch --depth 1 origin 25b72352adb6543fa6d0bd3795780672b2e238e0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SKSE API unavailable' }
          git -C papyrus-api sparse-checkout set scripts
          git -C papyrus-api checkout --detach 25b72352adb6543fa6d0bd3795780672b2e238e0
          if ($LASTEXITCODE -ne 0) { throw 'Wrong SKSE API revision' }
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/schlangster/skyui.git skyui-api
          if ($LASTEXITCODE -ne 0) { throw 'SkyUI API unavailable' }
          git -C skyui-api fetch --depth 1 origin 835428728e2305865e220fdfc99d791434955eb1
          if ($LASTEXITCODE -ne 0) { throw 'Pinned SkyUI API unavailable' }
          git -C skyui-api sparse-checkout set dist/Data/Scripts
          git -C skyui-api checkout --detach 835428728e2305865e220fdfc99d791434955eb1
          if ($LASTEXITCODE -ne 0) { throw 'Wrong SkyUI API revision' }
          python tools/frostbite_build.py imports --skse papyrus-api --skyui skyui-api --out papyrus-imports
          if ($LASTEXITCODE -ne 0) { throw 'Cannot construct compiler imports' }
      - name: Compile the four actual runtime scripts
        run: |
          New-Item -ItemType Directory -Force compiled-pex | Out-Null
          $compiler = (Get-ChildItem caprica -Recurse -Filter Caprica.exe | Select-Object -First 1).FullName
          $imports = "$env:GITHUB_WORKSPACE/mods/frostbite-chs/Data/scripts/source;$env:GITHUB_WORKSPACE/papyrus-imports"
          & $compiler --game=skyrim --import=$imports --flags="$env:GITHUB_WORKSPACE/papyrus-imports/TESV_Papyrus_Flags.flg" --output="$env:GITHUB_WORKSPACE/compiled-pex" "$env:GITHUB_WORKSPACE/mods/frostbite-chs/Data/scripts/source" 2>&1 | Tee-Object logs/papyrus-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Papyrus compilation failed' }
      - name: Review compiled bytecode and package
        run: |
          python tools/frostbite_build.py check --compiled compiled-pex | Tee-Object logs/compiled-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Compiled PEX review failed' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/frostbite_build.py package --compiled compiled-pex --out artifacts | Tee-Object logs/archive-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Frostbite-CHS-Cold15
          path: artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frostbite-CHS-diagnostics
          path: logs/
          if-no-files-found: warn
