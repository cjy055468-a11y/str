name: Compile iNeed STR consume animation overlay
on:
  push:
    branches: [codex/ineed-str-animation-v184]
    paths:
      - 'mods/ineed-str/**'
      - 'tools/*ineed*'
      - 'tools/ineed-interfaces/**'
      - 'tools/skyrim_pex.py'
      - '.github/workflows/ineed-compat.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Papyrus toolchain
        run: |
          Invoke-WebRequest 'https://github.com/Orvid/Caprica/releases/download/v0.3.0/Caprica.v0.3.0.7z' -OutFile Caprica.7z
          if ((Get-FileHash Caprica.7z -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0037e54cf3a1021e976278d9a637e8ae541aaf9ebeb8d274b6c2cfe32f4ee559') { throw 'Compiler hash mismatch' }
          7z x Caprica.7z -ocaprica -y
          if ($LASTEXITCODE -ne 0) { throw 'Compiler extraction failed' }
          git clone https://github.com/ianpatt/skse64.git papyrus-api
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve native interfaces' }
          git -C papyrus-api checkout 25b72352adb6543fa6d0bd3795780672b2e238e0
          if ($LASTEXITCODE -ne 0) { throw 'Wrong native interfaces' }
      - name: Compile all six runtime scripts for Skyrim
        run: |
          New-Item -ItemType Directory -Force compiled-pex, logs, papyrus-imports | Out-Null
          python tools/prepare-ineed-imports.py papyrus-api papyrus-imports
          if ($LASTEXITCODE -ne 0) { throw 'Interface preparation failed' }
          $compiler = (Get-ChildItem caprica -Recurse -Filter Caprica.exe | Select-Object -First 1).FullName
          $imports = "$env:GITHUB_WORKSPACE/mods/ineed-str/Scripts/Source;$env:GITHUB_WORKSPACE/papyrus-imports"
          & $compiler --ignorecwd --game=skyrim --dump-asm --import=$imports --flags="$env:GITHUB_WORKSPACE/papyrus-imports/TESV_Papyrus_Flags.flg" --output="$env:GITHUB_WORKSPACE/compiled-pex" "$env:GITHUB_WORKSPACE/mods/ineed-str/Scripts/Source" 2>&1 | Tee-Object logs/papyrus-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Papyrus compile failed' }
          foreach ($script in '_SNPlayerAlias', '_SNSTRConsumeRelay', '_SNSTRConsumePulse') {
            Copy-Item "compiled-pex/$script.pex" mods/ineed-str/Scripts/
          }
          python tools/check-ineed.py mods/ineed-str compiled-pex | Tee-Object logs/checks.json
          if ($LASTEXITCODE -ne 0) { throw 'Overlay validation failed' }
      - name: Package the MO2 overlay
        run: |
          Compress-Archive -Path mods/ineed-str/* -DestinationPath iNeed-STR-Compatibility-v0.2-Animation-test.zip
      - name: Retain reviewed binaries and package on the requested branch
        run: |
          New-Item -ItemType Directory -Force packages | Out-Null
          Copy-Item iNeed-STR-Compatibility-v0.2-Animation-test.zip packages/
          Copy-Item logs/checks.json fixes/ineed-build-checks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- packages/iNeed-STR-Compatibility-v0.2-Animation-test.zip mods/ineed-str/Scripts/*.pex fixes/ineed-build-checks.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Retain compiled iNeed animation test package [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot retain compiled files' }
            git push origin HEAD:codex/ineed-str-animation-v184
            if ($LASTEXITCODE -ne 0) { throw 'Branch changed during packaging; refusing overwrite' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iNeed-STR-Compatibility-Animation
          path: |
            iNeed-STR-Compatibility-v0.2-Animation-test.zip
            compiled-pex/
            logs/
